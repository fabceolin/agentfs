# agents/document-conformance-agent.yaml
# RUN: TEA_IMAGE=ghcr.io/fabceolin/tea:gemma3n-e4b tea-docker run document-conformance-agent.yaml --input '{"raw_status": "[**Done**]"}'
#
# This agent normalizes status text for document conformance.
# For full conformance checking, see document-transformer-agent.yaml which uses
# the enhanced conformance schema (STORY-7.5) with detailed violation info.

name: document-conformance-fixer
description: Normalizes status text using local LLM classification

state_schema:
  raw_status: str
  normalized_status: str

settings:
  llm:
    backend: local
    n_ctx: 2048

config:
  raise_exceptions: true

nodes:
  # Step 1: Use local LLM for classification
  - name: llm_classify
    uses: llm.chat
    with:
      messages:
        - role: user
          content: |
            Classify this status into exactly one of: Draft, Approved, InProgress, Review, Done

            Input: "{{ state.raw_status }}"

            Output only the single word classification:
      max_tokens: 8
      temperature: 0.0
    output: llm_response

  # Step 2: Parse LLM response
  - name: parse_llm_response
    language: lua
    run: |
      local resp = state.llm_response or {}
      local content = resp.content or "Draft"
      local status = content:match("^%s*(%w+)") or "Draft"
      local valid = { Draft=true, Approved=true, InProgress=true, Review=true, Done=true }
      if not valid[status] then
        status = "Draft"
      end
      return { normalized_status = status }
