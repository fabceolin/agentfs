# Overlay for document-transformer-agent to use Claude shell provider
# Usage: tea-python run agents/document-transformer-agent.yaml -f agents/overlay/claude-transformer.yaml --input '...'
#
# STORY-8.1 FIX: Increased max_tokens to handle large documents (up to 50KB)
# Previous: 4096 tokens (~15KB) caused truncation and content loss
#
# STORY-8.1 FIX: Increased timeout to 15 minutes for large documents (>70KB)
# Previous: 300s default caused timeout for files >70KB

settings:
  llm:
    backend: shell
    shell_provider: claude

nodes:
  - name: transform_with_llm
    uses: llm.chat
    with:
      provider: shell
      shell_provider: claude
      messages:
        - role: user
          content: "{{ state.final_prompt }}"
      max_tokens: 16384
      temperature: 0.1
      timeout: 900  # 15 minutes for large documents
    output: transform_result
